# Dependency updates arrive as pull requests that run CI, instead of being
# noticed by hand months later. Grouped so a week of patches is one review.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch
    # Majors change what the build and the type checker enforce, so they come
    # one at a time and get their own review.
    ignore:
      # vitest 5 changed the type parameters of Assertion, and jest-dom 7.0.1,
      # the current latest, still declares the vitest 4 shape: the two cannot
      # typecheck together. Drop this once jest-dom supports vitest 5.
      - dependency-name: vitest
        versions:
          - ">=5"


  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
