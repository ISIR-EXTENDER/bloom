name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - migration/web-interface-monorepo

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor the project supports, and the version it is deployed on
        # (Ubuntu 24.04 / ROS 2 Jazzy).
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint backend
        working-directory: backend
        run: make lint

      - name: Run backend tests
        working-directory: backend
        run: make test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend formatting and linting
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm run test

  visual:
    name: Visual
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual smoke checks
        run: npm run visual:smoke

      - name: Upload captures on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-smoke-captures
          path: /tmp/bloom-visual-smoke
          if-no-files-found: ignore

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Run dependency audits
        run: npm run audit:security

      - name: Start Bloom API
        working-directory: backend
        run: |
          uv run uvicorn apps.bloom_api.main:app --host 127.0.0.1 --port 8000 > /tmp/bloom-api.log 2>&1 &
          echo "$!" > /tmp/bloom-api.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bloom-api.log
          exit 1

      - name: Run dynamic security smoke
        run: npm run security:dynamic

      - name: Stop Bloom API
        if: always()
        run: |
          if [ -f /tmp/bloom-api.pid ]; then
            kill "$(cat /tmp/bloom-api.pid)" || true
          fi
