name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep the failure captures short-lived: they are for the PR that failed, not an archive.
  ARTIFACT_RETENTION_DAYS: 5

jobs:
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # The floor the project supports, and the version it is deployed on
        # (Ubuntu 24.04 / ROS 2 Jazzy).
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Lint backend
        working-directory: backend
        run: make lint

      - name: Run backend tests
        working-directory: backend
        run: make test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend formatting and linting
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm run test

      - name: Check app contracts and version carriers
        run: npm run check:contracts

      - name: Check repository invariants
        run: npm run qa:review

  coverage:
    # The coverage scripts fail under the thresholds their own config carries; CI only runs them and keeps the
    # reports. Skipped, not failed, on a branch that does not carry the scripts yet.
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Find the coverage scripts
        id: scripts
        run: |
          frontend=$(node -e 'process.stdout.write(require("./package.json").scripts.coverage ? "true" : "false")')
          backend=$(grep -qE '^coverage:' backend/Makefile && echo true || echo false)
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend coverage script: ${frontend}; backend coverage target: ${backend}"

      - name: Install dependencies
        if: steps.scripts.outputs.frontend == 'true'
        run: npm ci

      - name: Frontend coverage
        if: steps.scripts.outputs.frontend == 'true'
        run: npm run coverage

      - name: Backend coverage
        if: steps.scripts.outputs.backend == 'true'
        run: make -C backend coverage

      - name: Upload coverage reports
        if: always() && (steps.scripts.outputs.frontend == 'true' || steps.scripts.outputs.backend == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            **/coverage/lcov.info
            **/coverage/coverage.xml
            **/coverage/coverage.json
            **/coverage/coverage-summary.json
            !**/node_modules/**
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  builder:
    name: Builder end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        id: playwright
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Author, save and run an app through the real API
        run: npm run e2e:builder

      - name: Upload captures and logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: builder-e2e-captures
          path: /tmp/bloom-builder-e2e
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  visual:
    # Split in two: the smoke alone took 4.8 min and the sweep 2.9 min in one job.
    name: Visual (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - check: smoke
            command: node scripts/visual-smoke.mjs
            captures: /tmp/bloom-visual-smoke
          - check: sweep
            command: npm run visual:sweep
            captures: /tmp/bloom-screen-sweep

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        id: playwright
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run visual ${{ matrix.check }}
        run: ${{ matrix.command }}

      - name: Upload captures on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-${{ matrix.check }}-captures
          path: ${{ matrix.captures }}
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads the whole history, not the merge commit alone.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install frontend dependencies
        run: npm ci

      - name: Run dependency audits
        run: npm run audit:security

      - name: Scan the history for secrets
        # Pinned by digest; the action wrapper needs a licence for organisation repositories, the image does not.
        run: >
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --exit-code 1

      - name: Run Bandit on the backend
        # Medium severity and up; the low findings are subprocess and try/except idioms the code needs.
        run: uvx bandit==1.9.4 -q -r backend/apps backend/libs -ll

      - name: Start Bloom API
        working-directory: backend
        run: |
          uv run uvicorn apps.bloom_api.main:app --host 127.0.0.1 --port 8000 > /tmp/bloom-api.log 2>&1 &
          echo "$!" > /tmp/bloom-api.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bloom-api.log
          exit 1

      - name: Run dynamic security smoke
        run: npm run security:dynamic

      - name: Stop Bloom API
        if: always()
        run: |
          if [ -f /tmp/bloom-api.pid ]; then
            kill "$(cat /tmp/bloom-api.pid)" || true
          fi

      - name: Upload the API log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-api-log
          path: /tmp/bloom-api.log
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Advisories only; a licence policy is the owner's call (docs/ci.md says how to add one).
          fail-on-severity: moderate

  gate:
    # The one check branch protection requires: green only when every job above is green or legitimately skipped.
    name: Gate
    if: always()
    needs: [backend, frontend, coverage, builder, visual, security, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Check every job result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo "A required job failed or was cancelled." >&2
            exit 1
          fi
