name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Draft release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # Create the draft release and attach its files.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: npm ci

      - name: Check that every version carrier agrees with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm run check:version
          version=$(node -e 'process.stdout.write(require("./package.json").version)')
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match version ${version}" >&2
            exit 1
          fi

      - name: Run the full gate
        run: |
          make -C backend lint
          make -C backend test
          npm run check
          npm run build
          npm run test
          npm run check:contracts
          npm run qa:review
          npm run audit:security

      - name: Package the dashboard build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          tar -C frontend/apps/bloom-dashboard/dist -czf "release/bloom-dashboard-${TAG}.tar.gz" .
          (cd release && sha256sum "bloom-dashboard-${TAG}.tar.gz" > "bloom-dashboard-${TAG}.tar.gz.sha256")

      - name: Generate the CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: release/bloom-${{ github.ref_name }}.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Take this version's CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/changelog-section.mjs "${TAG#v}" > release/notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "${TAG}" --draft --verify-tag
          --title "Bloom ${TAG}" --notes-file release/notes.md
          "release/bloom-dashboard-${TAG}.tar.gz"
          "release/bloom-dashboard-${TAG}.tar.gz.sha256"
          "release/bloom-${TAG}.cyclonedx.json"
