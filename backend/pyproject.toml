[project]
name = "bloom-backend"
version = "0.2.0"
description = "FastAPI backend for Bloom."
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110,<1",
  "msgpack>=1.2.1",
  "numpy>=2.2.6",
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
  "rich>=13,<16",
  "starlette>=1.3.1",
  "typer>=0.26.4",
  "uvicorn>=0.27,<1",
  "websockets>=12,<17",
]

[dependency-groups]
dev = [
  "httpx2>=2.12.0",
  # pip-audit pulls pip in transitively, and the audit gate then reports pip's
  # own advisories. Constrain it to a patched release instead of suppressing
  # the finding.
  "pip>=26.2",
  "pip-audit>=2.10.0",
  "pytest>=9.0.3,<10",
  "ruff>=0.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Matches the frontend's Biome line width, so a file reads the same either side.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Correctness and clarity, not style opinions: pyflakes, pycodestyle, import
# order, modern syntax, bugbear, comprehensions.
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.flake8-bugbear]
# Calling these in a default argument is how FastAPI and Typer are written.
# B008 exists to catch a mutable default evaluated once; these are neither.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "typer.Argument",
  "typer.Option",
]
