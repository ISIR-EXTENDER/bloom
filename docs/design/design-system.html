document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c24a471c-8ade-486d-afee-7ddda9287b48\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #f2eadc; }\n  a { color: #31493f; } a:hover { color: #9b3d2e; }\n  * { box-sizing: border-box; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height: 100vh; background: #f2eadc; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #253d35\">\n\n  <div style=\"max-width: 1160px; margin: 0 auto; padding: 64px 32px 8px\">\n    <p style=\"margin: 0 0 14px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Bloom · implementation reference · docs/design/<\u002Fp>\n    <h1 style=\"margin: 0 0 22px; font-family: 'Cormorant Garamond', serif; font-size: 58px; font-weight: 500; line-height: 1.02; letter-spacing: -0.01em; max-width: 20ch\">The rules a screen must hold before it reaches an operator.<\u002Fh1>\n    <p style=\"margin: 0 0 14px; font-size: 18px; line-height: 1.6; max-width: 66ch; text-wrap: pretty\">Bloom already has tokens, presets, contrast tests and a written design system. What it does not have is a <strong>geometry contract<\u002Fstrong>: nothing in the builder, the seed files or the renderers knows how much room a widget's own content needs. So a gripper gets authored at 130×130, renders a title, a 56&nbsp;px button and a 28-character topic string, and is cut — and no test fails.<\u002Fp>\n    <p style=\"margin: 0; font-size: 16px; line-height: 1.6; max-width: 66ch; color: #536960; text-wrap: pretty\">This page is that contract. Every number below is derived from a file in the repo, not chosen: tokens from <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">libs/ui/src/theme.ts<\u002Fcode>, content heights from the renderers in <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">libs/widget-renderers/src<\u002Fcode>, geometry from <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">backend/seed/applications<\u002Fcode>.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 1160px; margin: 0 auto; padding: 36px 32px 0; display: flex; flex-wrap: wrap; gap: 10px\">\n    <a href=\"#diagnosis\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">01 Diagnosis<\u002Fa>\n    <a href=\"#color\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">02 Colour<\u002Fa>\n    <a href=\"#series\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">02b Series ramp<\u002Fa>\n    <a href=\"#type\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">03 Type<\u002Fa>\n    <a href=\"#density\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">04 Density<\u002Fa>\n    <a href=\"#regions\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">05 Artboard<\u002Fa>\n    <a href=\"#anatomy\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">06 Card anatomy<\u002Fa>\n    <a href=\"#pad\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #31493f; color: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">06b Pad recipe<\u002Fa>\n    <a href=\"#minsize\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #31493f; color: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">07 Minimum sizes<\u002Fa>\n    <a href=\"#defaults\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">08 Defaults<\u002Fa>\n    <a href=\"#states\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">09 States<\u002Fa>\n    <a href=\"#chrome\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">10 Chrome<\u002Fa>\n    <a href=\"#locale\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">11 Locale<\u002Fa>\n    <a href=\"#builder\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">12 Builder<\u002Fa>\n    <a href=\"#landing\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">13 Landing<\u002Fa>\n    <a href=\"#invariants\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">14 Invariants<\u002Fa>\n    <a href=\"#trace\" style=\"padding: 9px 16px; border: 1px solid rgba(49,73,63,0.18); border-radius: 999px; background: #fffaf1; font-size: 14px; font-weight: 700; text-decoration: none\">15 Traceability<\u002Fa>\n  <\u002Fdiv>\n\n  <div id=\"diagnosis\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">01<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Three bugs, one missing rule<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 24px; font-size: 18px; line-height: 1.6; max-width: 70ch; text-wrap: pretty\">These are not three unrelated defects. All three are the same absence: <strong>authored geometry is trusted, and content is never measured against it.<\u002Fstrong><\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 28px\">\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; border-left: 4px solid #9b3d2e\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #9b3d2e; font-weight: 700; margin-bottom: 10px\">Observed · Drive, both robots<\u002Fdiv>\n        <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.55\"><strong>The gripper card is cut.<\u002Fstrong> <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">drive-gripper<\u002Fcode> is authored 130×130 with <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">show_details: true<\u002Fcode>. <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">ToggleWidget<\u002Fcode> renders three stacked rows — title, 56&nbsp;px button, then the literal topic <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">/gripper_controller/commands<\u002Fcode>.<\u002Fp>\n        <p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; color: #536960\">needs 250×144 · has 130×130<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; border-left: 4px solid #9b3d2e\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #9b3d2e; font-weight: 700; margin-bottom: 10px\">Observed · Drive, both robots<\u002Fdiv>\n        <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.55\"><strong>Pivot is shorter than Height.<\u002Fstrong> <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">drive-rz<\u002Fcode> is 130×260; <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">drive-z<\u002Fcode> is 130×440. Two controls of the same kind, on the same row, at different sizes — and 260 is below the vertical slider's own minimum, so the readout clips too.<\u002Fp>\n        <p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; color: #536960\">needs 312 tall · has 260 · sibling has 440<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; border-left: 4px solid #9b3d2e\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #9b3d2e; font-weight: 700; margin-bottom: 10px\">Observed · Drive, Explorer<\u002Fdiv>\n        <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.55\"><strong>Speed readouts are cut mid-digit.<\u002Fstrong> <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">drive-max-linear-speed<\u002Fcode> is 210×130 and renders title + unit + a <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">min → max<\u002Fcode> range on one header line. At 210 px the range runs past the card edge.<\u002Fp>\n        <p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; color: #536960\">needs 300×132 · has 210×130<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px\">\n      <div style=\"padding: 22px; background: #31493f; color: #fffaf1; border-radius: 18px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #c8d5c4; margin-bottom: 10px\">R1<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\"><strong>Every widget kind declares a minimum size<\u002Fstrong>, computed from what it actually renders in the configuration it is given. §07 is that table.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #31493f; color: #fffaf1; border-radius: 18px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #c8d5c4; margin-bottom: 10px\">R2<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\"><strong>A card grows rather than clips.<\u002Fstrong> The frame's content box gets <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">min-height<\u002Fcode>, not <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">overflow: hidden<\u002Fcode>. Clipping an operator control is never the correct failure.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #31493f; color: #fffaf1; border-radius: 18px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #c8d5c4; margin-bottom: 10px\">R3<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\"><strong>Siblings of one kind on one row share one size.<\u002Fstrong> Height and Pivot, Both and Jaco, the two speed limits. Asymmetry has to mean something.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #31493f; color: #fffaf1; border-radius: 18px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #c8d5c4; margin-bottom: 10px\">R4<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\"><strong>The builder warns, it does not block.<\u002Fstrong> Existing seeds stay valid; an undersized widget is flagged in the inspector and in the review checklist, with the required size offered as a one-tap fix.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"color\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">02<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Colour — palette, roles, and three violations<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-bottom: 18px\">\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #31493f\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">forest<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#31493f<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #7e967e\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">sage<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#7e967e<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #839a82\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">accent<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#839a82<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #c8d5c4\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">mist<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#c8d5c4<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #c7bddc\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">lilac<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#c7bddc<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #eebbbb\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">petal<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#eebbbb<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #ffd89b\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">pollen<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#ffd89b<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #9b3d2e\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">error<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#9b3d2e<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #f2eadc\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">cream<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#f2eadc<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #f8f4eb\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">surfaceSoft<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#f8f4eb<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #fffaf1; border-bottom: 1px solid rgba(49,73,63,0.14)\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">paper<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#fffaf1<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 14px; overflow: hidden; background: #fffaf1\">\n        <div style=\"height: 72px; background: #253d35\"><\u002Fdiv>\n        <div style=\"padding: 10px 12px\"><div style=\"font-size: 14px; font-weight: 700\">ink<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">#253d35<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px\">\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 12px\">What each colour is allowed to mean<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.5\">\n          <div style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: 0 0 16px; height: 16px; margin-top: 4px; border-radius: 4px; background: #31493f\"><\u002Fspan><span><strong>forest<\u002Fstrong> — primary, the selected/active state, the one committed action on a surface.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: 0 0 16px; height: 16px; margin-top: 4px; border-radius: 4px; background: #7e967e\"><\u002Fspan><span><strong>sage<\u002Fstrong> — live motion: joystick knobs, slider thumbs, anything the operator is holding.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: 0 0 16px; height: 16px; margin-top: 4px; border-radius: 4px; background: #c8d5c4\"><\u002Fspan><span><strong>mist<\u002Fstrong> — resting truthful status (READY), current screen in maintenance, progress fills.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: 0 0 16px; height: 16px; margin-top: 4px; border-radius: 4px; background: #ffd89b\"><\u002Fspan><span><strong>pollen<\u002Fstrong> — a held, momentary or latched state that will end by itself. Never a resting state.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: 0 0 16px; height: 16px; margin-top: 4px; border-radius: 4px; background: #c7bddc\"><\u002Fspan><span><strong>lilac<\u002Fstrong> — debug and inspection surfaces only. Never inside an operator app.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: 0 0 16px; height: 16px; margin-top: 4px; border-radius: 4px; background: #9b3d2e\"><\u002Fspan><span><strong>error<\u002Fstrong> — STOP, latched stop, destructive release. Always paired with a word.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #f5ddd8; border: 1px solid rgba(155,61,46,0.3); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #4f1f16; font-weight: 700; margin-bottom: 12px\">Violations in the tree today<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.5; color: #4f1f16\">\n          <div style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: 0 0 16px; height: 16px; margin-top: 4px; border-radius: 4px; background: #4a9eff; border: 1px solid rgba(0,0,0,0.15)\"><\u002Fspan><span><code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">#4a9eff<\u002Fcode> — the translation axis colour in both seed apps. Not a Bloom token; it is the only pure blue in the product.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: 0 0 16px; height: 16px; margin-top: 4px; border-radius: 4px; background: #e0685f; border: 1px solid rgba(0,0,0,0.15)\"><\u002Fspan><span><code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">#e0685f<\u002Fcode> — the rotation axis colour. Close enough to <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">error<\u002Fcode> to read as a warning on a control that is perfectly safe.<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; align-items: flex-start\"><span style=\"flex: 0 0 16px; height: 16px; margin-top: 4px; border-radius: 4px; background: #7fa95f; border: 1px solid rgba(0,0,0,0.15)\"><\u002Fspan><span><code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">#7fa95f<\u002Fcode> — the joystick's hard-coded fallback in <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">control-renderers.tsx<\u002Fcode>. Should be <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">--bloom-color-sage<\u002Fcode>.<\u002Fspan><\u002Fdiv>\n          <p style=\"margin: 4px 0 0; font-size: 15px; line-height: 1.5\"><strong>Replace with:<\u002Fstrong> translation <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">sage<\u002Fcode>, rotation <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">clay<\u002Fcode> — the first two entries of the series ramp in §02b. Same lightness, different hue, and named rather than typed in.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"series\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">02b<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">The series ramp — the gap that made people name hexes<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 22px; font-size: 18px; line-height: 1.6; max-width: 70ch; text-wrap: pretty\">Invariant 02 says no feature file names a colour — and then the plot board needs eight distinguishable series and the token set has six semantic colours, none of which mean \"the fifth thing on a chart\". So people invent hexes. The fix is a token set for the need, not an exception to the rule.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px; margin-bottom: 18px\">\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 12px; overflow: hidden; background: #fffaf1\"><div style=\"height: 56px; background: #31493f\"><\u002Fdiv><div style=\"padding: 8px 10px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700\">series-1<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #536960\">#31493f<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 12px; overflow: hidden; background: #fffaf1\"><div style=\"height: 56px; background: #7e967e\"><\u002Fdiv><div style=\"padding: 8px 10px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700\">series-2<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #536960\">#7e967e<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 12px; overflow: hidden; background: #fffaf1\"><div style=\"height: 56px; background: #c98a7e\"><\u002Fdiv><div style=\"padding: 8px 10px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700\">series-3<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #536960\">#c98a7e<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 12px; overflow: hidden; background: #fffaf1\"><div style=\"height: 56px; background: #536960\"><\u002Fdiv><div style=\"padding: 8px 10px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700\">series-4<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #536960\">#536960<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 12px; overflow: hidden; background: #fffaf1\"><div style=\"height: 56px; background: #8a7f5c\"><\u002Fdiv><div style=\"padding: 8px 10px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700\">series-5<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #536960\">#8a7f5c<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 12px; overflow: hidden; background: #fffaf1\"><div style=\"height: 56px; background: #6b7f8a\"><\u002Fdiv><div style=\"padding: 8px 10px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700\">series-6<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #536960\">#6b7f8a<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 12px; overflow: hidden; background: #fffaf1\"><div style=\"height: 56px; background: #8a6b7f\"><\u002Fdiv><div style=\"padding: 8px 10px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700\">series-7<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #536960\">#8a6b7f<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border: 1px solid rgba(49,73,63,0.14); border-radius: 12px; overflow: hidden; background: #fffaf1\"><div style=\"height: 56px; background: #5c7d6b\"><\u002Fdiv><div style=\"padding: 8px 10px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700\">series-8<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #536960\">#5c7d6b<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px\">\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 10px\">How it is built<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">One hue rotation at roughly constant lightness, starting from forest and sage so the first two series are the product's own colours. Every entry sits between L* 40 and 62, so no series disappears on cream and none shouts.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 10px\">Rules<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Assign in order; never skip to pick a nicer colour. <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">series-1<\u002Fcode> is the emphasised series where one exists — the manager output on Command sources. Series colour is <strong>never<\u002Fstrong> semantic: a red series does not mean a bad value.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #e7ede2; border: 1px solid rgba(49,73,63,0.2); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 10px\">Eight is the limit<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Past eight overlaid series a plot is not readable and colour cannot carry the difference. The picker allows more; the ramp repeats with a dashed stroke and the design does not pretend that is legible.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"type\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">03<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Type — three faces, one floor<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-bottom: 16px\">\n      <div style=\"padding: 24px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 500; line-height: 1.1; margin-bottom: 10px\">Cormorant Garamond<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #536960\">Display. Landing, builder card titles, empty states. <strong>Never inside a runtime app<\u002Fstrong> — an operator reading at arm's length does not need a serif.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 24px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 32px; font-weight: 700; line-height: 1.2; margin-bottom: 10px\">Atkinson Hyperlegible<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #536960\">Everything a person must act on: widget titles, buttons, direction words, status, settings. Its disambiguated letterforms are the reason it is here, not the look.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 24px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; line-height: 1.25; margin-bottom: 10px\">JetBrains Mono<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #536960\">Machine values only: topics, frame ids, numeric readouts, payloads. If it is monospaced, it came from the robot or goes to the robot.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding: 24px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n      <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #536960; font-weight: 700; margin-bottom: 16px\">Runtime scale · minimum sizes, not suggestions<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px\">\n        <div><div style=\"font-size: 22px; font-weight: 700; margin-bottom: 4px\">Screen title<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #536960\">22px / 700 / bar<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size: 19px; font-weight: 700; margin-bottom: 4px\">Widget title<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #536960\">19px / 700 / 1.25<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size: 17px; font-weight: 700; margin-bottom: 4px\">Direction word<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #536960\">17px / 700 · floor<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; margin-bottom: 4px\">+0.42<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #536960\">16px mono · readout<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px\">Group label<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #536960\">12px / 0.14em · floor<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 16px 0 0; font-size: 15px; line-height: 1.55; color: #536960; max-width: 70ch; text-wrap: pretty\">Nothing an operator reads goes below 15&nbsp;px, and nothing they act on below 17&nbsp;px. The 12&nbsp;px group label is the single exception: it names a region, it is never the only carrier of meaning, and it is never inside a control.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"density\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">04<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Density — which surface gets which target<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px\">\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: #31493f\">40px<\u002Fdiv>\n        <div style=\"height: 40px; border: 2px dashed rgba(49,73,63,0.3); border-radius: 10px\"><\u002Fdiv>\n        <div><div style=\"font-size: 17px; font-weight: 700; margin-bottom: 4px\">compact<\u002Fdiv><div style=\"font-size: 15px; line-height: 1.5; color: #536960\">Builder and admin only. Configuration fields, list rows, inspector inputs. <strong>Never in runtime.<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: #31493f\">48px<\u002Fdiv>\n        <div style=\"height: 48px; border: 2px dashed rgba(49,73,63,0.3); border-radius: 10px\"><\u002Fdiv>\n        <div><div style=\"font-size: 17px; font-weight: 700; margin-bottom: 4px\">tablet · default<\u002Fdiv><div style=\"font-size: 15px; line-height: 1.5; color: #536960\">Library, maintenance sheet, settings rows. The floor for anything touched at all.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #fffaf1; border: 2px solid #31493f; border-radius: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: #31493f\">56px<\u002Fdiv>\n        <div style=\"height: 56px; border: 2px solid #31493f; border-radius: 10px; background: #e7ede2\"><\u002Fdiv>\n        <div><div style=\"font-size: 17px; font-weight: 700; margin-bottom: 4px\">comfortable · runtime<\u002Fdiv><div style=\"font-size: 15px; line-height: 1.5; color: #536960\">Every control inside an operator app: mode buttons, gripper, frame buttons, settings steppers.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: #31493f\">64px<\u002Fdiv>\n        <div style=\"height: 64px; border: 2px dashed rgba(49,73,63,0.3); border-radius: 10px\"><\u002Fdiv>\n        <div><div style=\"font-size: 17px; font-weight: 700; margin-bottom: 4px\">high-visibility<\u002Fdiv><div style=\"font-size: 15px; line-height: 1.5; color: #536960\">Sunlight, gloves, motor-accessibility profiles. Step targets, scan targets, STOP.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 18px 0 0; font-size: 16px; line-height: 1.6; max-width: 70ch; color: #536960; text-wrap: pretty\">The target is <em>physical<\u002Fem>. A canvas fit-scaled to 0.8 turns a 56&nbsp;px button into 45&nbsp;px of glass. The minimum-size table in §07 is stated at scale 1.0; the builder must report the effective size after fit, for the whole screen, not one selected widget.<\u002Fp>\n  <\u002Fdiv>\n\n  <div id=\"targets\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">04b<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Target sizes — where the target lives inside a card<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 22px; font-size: 18px; line-height: 1.6; max-width: 70ch; text-wrap: pretty\">§04 says which density a surface owes a hand. This says where that target actually is inside each widget, as a formula over the card's width <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">w<\u002Fcode> and height <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">h<\u002Fcode> at scale 1.0, so the builder can multiply it by the fit scale and report the size on the glass. Ships as <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">primaryTargetFor<\u002Fcode> beside <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">minSizeFor<\u002Fcode> in <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">libs/widgets<\u002Fcode>. A kind absent from this table declares no target — which is also what makes it non-interactive, so nothing else needs to keep a second list.<\u002Fp>\n\n    <div style=\"overflow-x: auto; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; padding: 8px\">\n      <sc-raw-table style=\"width: 100%; min-width: 680px; border-collapse: collapse; font-size: 15px\">\n        <sc-raw-thead>\n          <sc-raw-tr style=\"text-align: left\">\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">kind<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">target<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">derivation<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">toggle<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">56<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">the comfortable runtime target; the switch is that size whatever the card is<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">joystick · title above<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">round(max(96, min(w, h - 32) - 4) * 0.26)<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">the knob, from the pad recipe — the pad is the zone, the knob is the target. The pad is what is left of the card once the title row and the 2 px surface border are paid for<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">joystick · title in the corner<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">round(max(96, min(w, h) - 4) * 0.26)<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">an overlaid title costs no row, so the pad keeps the card's short edge<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">joystick · with readouts<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">round(max(96, min(w, h - 70) - 4) * 0.26)<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">the x/y readouts take a further 38 px under the title, and the knob shrinks with the pad<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">gesture-pad<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">min(w, h)<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">the pad fills the card, so the card's short edge is the target<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">slider · segments<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">64<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">three high-visibility step targets instead of fine motor control<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">slider · return to centre<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">64<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">a motion axis is held, not set; it takes the high-visibility size<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">slider · continuous<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">56<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">the limit thumb, the smallest target that still survives a tablet fit<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">command-button<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">min(56, h - 32)<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">the button under its own title, inside 32 px of card padding<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">command-button · in a group<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">h - 32<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">under a group label the button is the card, less its padding<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n\n    <p style=\"margin: 18px 0 0; font-size: 16px; line-height: 1.6; max-width: 70ch; color: #536960; text-wrap: pretty\">The continuous limit is 56 and not 48 because of the fit: a 1280×720 tablet screen reaches the class's smallest panel at 0.80, and floor(56&nbsp;×&nbsp;0.80) = 44, exactly the floor. At 48 it arrives as 38, and the two Drive&nbsp;·&nbsp;Bench speed limits failed the check on both shipped robots. The runtime thumb is drawn at the same 56, so the number the builder reports is the thing the hand meets.<\u002Fp>\n  <\u002Fdiv>\n\n  <div id=\"regions\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">05<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">The artboard — named regions for new screens<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 22px; font-size: 18px; line-height: 1.6; max-width: 70ch; text-wrap: pretty\">Authored at <strong>1280×720<\u002Fstrong>, checked at 1024×600. The kiosk bar takes 44&nbsp;px, leaving a <strong>676&nbsp;px<\u002Fstrong> body at native and 556&nbsp;px at the small panel (ADR 0127). Free absolute placement stays supported for existing apps; new screens are composed from four named regions so that a control is in the same place on every screen of an app — the eyes-off requirement.<\u002Fp>\n\n    <div style=\"background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 22px; padding: 18px; margin-bottom: 16px\">\n      <div style=\"width: 100%; max-width: 1080px; margin: 0 auto; aspect-ratio: 1280 / 720; display: flex; flex-direction: column; gap: 6px\">\n        <div style=\"flex: 0 0 8.5%; background: #f8f4eb; border: 2px solid #31493f; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px\">\n          <span style=\"font-size: 14px; font-weight: 700\">bar · 44px · app, status, frame, profile, maintenance<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #536960\">fixed<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex: 0 0 16%; background: #e7ede2; border: 2px solid #839a82; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px\">\n          <span style=\"font-size: 14px; font-weight: 700\">context · 104px · what this screen is set to — frame, mode, gripper<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #536960\">optional<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex: 1; display: flex; gap: 6px; min-height: 0\">\n          <div style=\"flex: 1; background: #f2eadc; border: 2px solid #31493f; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px\">\n            <span style=\"font-size: 15px; font-weight: 700; line-height: 1.4\">stage · the controls the operator holds<br><span style=\"font-weight: 400; color: #536960\">never crossed by anything else<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex: 0 0 18%; background: #f8f4eb; border: 2px solid #839a82; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; padding: 8px\">\n            <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; text-align: center\"><span style=\"font-size: 14px; font-weight: 700; line-height: 1.35\">status<br><span style=\"font-weight: 400; color: #536960\">224px<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"flex: 0 0 34%; background: #9b3d2e; border-radius: 6px; display: flex; align-items: center; justify-content: center\"><span style=\"font-size: 15px; font-weight: 700; color: #fffaf1; letter-spacing: 0.06em\">STOP<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px\">\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #31493f; margin-bottom: 8px\">spacing<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55\">Artboard padding 14&nbsp;px, region gap 12&nbsp;px, card gap 12&nbsp;px, in-card gap 8&nbsp;px. Everything is a multiple of 2; nothing is a multiple of 5.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #31493f; margin-bottom: 8px\">radius<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55\">Control 14&nbsp;px, card 18&nbsp;px, pad 22&nbsp;px, panel 26&nbsp;px. Larger surface, larger radius — never the reverse.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #31493f; margin-bottom: 8px\">stage rule<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55\">The stage holds motion controls only. Speed limits, modes and publishing detail go to context or status, where a sleeve cannot catch them mid-task.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #31493f; margin-bottom: 8px\">1024×600<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55\">Context collapses to 88&nbsp;px, status to 196&nbsp;px, the stage keeps the rest. Nothing is hidden, nothing reflows to a new position.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"anatomy\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">06<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Card anatomy — where the pixels go<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 22px; font-size: 18px; line-height: 1.6; max-width: 70ch; text-wrap: pretty\">Every widget card is the same five bands. The minimum size of a kind is the sum of the bands it renders — which is why <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">show_details<\u002Fcode> is a geometry setting, not a cosmetic one.<\u002Fp>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start\">\n      <div style=\"flex: 0 0 300px; padding: 16px; background: #fffaf1; border: 2px solid #31493f; border-radius: 18px; display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"height: 24px; background: #e7ede2; border-radius: 6px; display: flex; align-items: center; padding: 0 8px; font-size: 13px; font-weight: 700\">title + unit · 24<\u002Fdiv>\n        <div style=\"height: 30px; background: #f2eadc; border-radius: 6px; display: flex; align-items: center; padding: 0 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">detail strip · 30 · only if show_details<\u002Fdiv>\n        <div style=\"height: 120px; background: #c8d5c4; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700\">control · kind minimum<\u002Fdiv>\n        <div style=\"height: 28px; background: #f2eadc; border-radius: 6px; display: flex; align-items: center; padding: 0 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">readout · 28<\u002Fdiv>\n        <div style=\"height: 18px; background: #f2eadc; border-radius: 6px; display: flex; align-items: center; padding: 0 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">topic · 18 · only if show_details<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n          <div style=\"font-size: 17px; font-weight: 700; margin-bottom: 8px\">Padding 16, gaps 8<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">A card's fixed overhead is <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">32 (padding) + 24 (title) + 8 (gap)<\u002Fcode> = <strong>64&nbsp;px<\u002Fstrong> before the control gets a single pixel. Add <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">+28<\u002Fcode> for a readout, <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">+56<\u002Fcode> for the detail strip and topic line.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n          <div style=\"font-size: 17px; font-weight: 700; margin-bottom: 8px\">The topic line sets the minimum width<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">A topic is rendered in 13&nbsp;px mono and must not wrap or clip. <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">/gripper_controller/commands<\u002Fcode> is 28 characters ≈ 218&nbsp;px, so the card cannot be narrower than <strong>250&nbsp;px<\u002Fstrong>. That single line is the whole gripper bug.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #e7ede2; border: 1px solid rgba(49,73,63,0.2); border-radius: 18px\">\n          <div style=\"font-size: 17px; font-weight: 700; margin-bottom: 8px\">Better: don't render the topic at all<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">An operator cannot act on <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">/gripper_controller/commands<\u002Fcode>. Runtime default is <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">show_details: false<\u002Fcode>; the topic belongs in maintenance diagnostics and in Bloom Debug. §08.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"pad\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">06b<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">The pad recipe — one formula, never a tuned number<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 22px; font-size: 18px; line-height: 1.6; max-width: 70ch; text-wrap: pretty\">A joystick pad has four direction labels, a dead-zone ring and a knob. Tuning those by eye per pad is how a design drifts: change the pad size and the four gaps stop matching, an arrow orphans onto its own line, and two pads side by side stop being the same square. <strong>Every number below is derived from one input — the pad's edge length <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px\">S<\u002Fcode>.<\u002Fstrong><\u002Fp>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start\">\n      <div style=\"flex: 0 0 300px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"position: relative; width: 300px; height: 300px; border: 2px solid rgba(49,73,63,0.18); border-radius: 22px; background: #f2eadc\">\n          <span style=\"position: absolute; top: 52px; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700; line-height: 20px\">▲&nbsp;Forward<\u002Fspan>\n          <span style=\"position: absolute; bottom: 52px; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700; line-height: 20px\">▼&nbsp;Back<\u002Fspan>\n          <span style=\"position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 64px; text-align: center; font-size: 17px; font-weight: 700; line-height: 20px\">◀&nbsp;Left<\u002Fspan>\n          <span style=\"position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 64px; text-align: center; font-size: 17px; font-weight: 700; line-height: 20px\">Right&nbsp;▶<\u002Fspan>\n          <span style=\"position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; border: 2px dashed rgba(49,73,63,0.28); border-radius: 50%; transform: translate(-50%, -50%)\"><\u
