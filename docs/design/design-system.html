002Fspan>\n          <span style=\"position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; border: 2px solid rgba(49,73,63,0.28); border-radius: 50%; transform: translate(-50%, -50%)\"><\u002Fspan>\n          <span style=\"position: absolute; left: 50%; top: 50%; width: 78px; height: 78px; border-radius: 50%; background: #7e967e; border: 3px solid #31493f; transform: translate(-50%, -50%)\"><\u002Fspan>\n          <span style=\"position: absolute; left: 8px; top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #536960\">S = 300<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #536960\">The operator pad at S = 300. Gap 12 on all four sides, by construction rather than by measurement.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"padding: 22px; background: #31493f; color: #fffaf1; border-radius: 18px\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #c8d5c4; font-weight: 700; margin-bottom: 12px\">The formula<\u002Fdiv>\n          <pre style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.7; white-space: pre-wrap\">inset      =  8          label edge to pad edge\nsc-camel-label-width = 64          fits \"Right ▶\" at the 17px floor\ngap        = 12          label edge to ring, all four sides\nsc-camel-line-height = 20\n\nblock      = inset + sc-camel-label-width            = 72\nsc-camel-top-inset   = block - sc-camel-line-height            = 52\nring       = S - 2 * (block + gap)         = S - 168\ndeadzone   = ring * 0.2                    the real 0.2 axis dead zone\nknob       = S * 0.26<\u002Fpre>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px\">\n          <div style=\"padding: 16px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 16px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; margin-bottom: 4px\">S 340<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; color: #536960\">ring 172 · dz 34 · knob 88<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 16px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 16px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; margin-bottom: 4px\">S 376<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; color: #536960\">ring 208 · dz 42 · knob 98<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 16px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 16px\"><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; margin-bottom: 4px\">S 300<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; color: #536960\">ring 132 · dz 26 · knob 78<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #f5ddd8; border: 1px solid rgba(155,61,46,0.3); border-radius: 18px\">\n          <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #4f1f16; font-weight: 700; margin-bottom: 10px\">Four rules that came from getting this wrong<\u002Fdiv>\n          <ul style=\"margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.6; color: #4f1f16; display: flex; flex-direction: column; gap: 6px\">\n            <li><strong>Ring in px, never %.<\u002Fstrong> A percentage ring on a non-square box renders an ellipse, and the four gaps stop matching.<\u002Fli>\n            <li><strong>Arrow bound to its word<\u002Fstrong> with <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">&amp;nbsp;<\u002Fcode>. The arrow carries the direction; orphaned on its own line it carries nothing, and the two sides end up different heights.<\u002Fli>\n            <li><strong>Pads in a pair are the same square.<\u002Fstrong> Set the pad <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">flex: 0 0 auto<\u002Fcode> so a flex parent cannot shave a pixel off one axis.<\u002Fli>\n            <li><strong>Pads in a row share a centre line.<\u002Fstrong> When one column has a trailing block (a Pivot slider), the other gets equal padding on its pad container — not a sibling spacer, which leaves a void and mis-centres by the flex gap.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin: 22px 0 0; font-size: 16px; line-height: 1.6; max-width: 70ch; color: #536960; text-wrap: pretty\">The columns beside the pads get their declared minimum and nothing more — on the operator layout that is a 264 rail, a 106 Height slider and a 202 gripper column, which leaves 318 and 316 for the two pads. The pads are the reason the screen exists.<\u002Fp>\n  <\u002Fdiv>\n\n  <div id=\"minsize\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">07<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Minimum size per widget kind — the contract<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 22px; font-size: 18px; line-height: 1.6; max-width: 70ch; text-wrap: pretty\">Stated at scale 1.0, in the same units as <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">widget.layout<\u002Fcode>. Ship as <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">WIDGET_MIN_SIZE<\u002Fcode> in <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; background: #fffaf1; padding: 2px 6px; border-radius: 5px\">libs/widgets<\u002Fcode> so the builder inspector, the review checklist and the seed validator all read one source.<\u002Fp>\n\n    <div style=\"overflow-x: auto; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; padding: 8px\">\n      <sc-raw-table style=\"width: 100%; min-width: 760px; border-collapse: collapse; font-size: 15px\">\n        <sc-raw-thead>\n          <sc-raw-tr style=\"text-align: left\">\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">kind<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">details off<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">details on<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">why<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">in tree<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">joystick<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">280×332<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">320×400<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">240 pad + 64 chrome + 28 readout; detail chips need 320 wide<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; color: #31493f; border-bottom: 1px solid rgba(49,73,63,0.1)\">ok<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">slider · vertical<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">104×284<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">130×312<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">220 track is the shortest that still resolves 0.01 steps by thumb<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; color: #9b3d2e; border-bottom: 1px solid rgba(49,73,63,0.1)\">drive-rz 260<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">slider · horizontal<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">260×104<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">300×132<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">title + unit + <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">min → max<\u002Fcode> share one header line<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; color: #9b3d2e; border-bottom: 1px solid rgba(49,73,63,0.1)\">speeds 210×130<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">toggle<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">200×120<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">250×144<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">verb label needs 200; the topic line needs 250<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; color: #9b3d2e; border-bottom: 1px solid rgba(49,73,63,0.1)\">drive-gripper 130×130<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">command-button<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">140×104<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">170×152<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">56 button + a two-line action label under it<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; color: #9b3d2e; border-bottom: 1px solid rgba(49,73,63,0.1)\">modes 150×130<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">topic-echo<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">226×200<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">280×280<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">a twist is 8 lines of mono; the action row adds 96 when details are on<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; color: #9b3d2e; border-bottom: 1px solid rgba(49,73,63,0.1)\">lab-sent 226 w/ details<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">topic-plot · gauge<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">280×180<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">320×240<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">a 30 s trace below 280 wide is decoration<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; color: #31493f; border-bottom: 1px solid rgba(49,73,63,0.1)\">ok<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-weight: 700\">label<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace\">120×28<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960\">at 12 px uppercase, 20 px tall cuts the descenders<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; color: #9b3d2e\">lab labels h:20<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch\">\n      <div style=\"flex: 1 1 340px; padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #9b3d2e; font-weight: 700; margin-bottom: 12px\">As authored · 130×130 · cut<\u002Fdiv>\n        <div style=\"width: 130px; height: 130px; padding: 16px; background: #f8f4eb; border: 1px solid rgba(49,73,63,0.18); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"font-size: 19px; font-weight: 700; white-space: nowrap\">Gripper<\u002Fdiv>\n          <div style=\"flex: 0 0 56px; min-height: 56px; border: 1px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; white-space: nowrap\">OPEN<\u002Fdiv>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #536960; white-space: nowrap\">/gripper_controller/commands<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 14px 0 0; font-size: 15px; line-height: 1.55; color: #536960\">Three bands that need 144&nbsp;px of height and 250&nbsp;px of width, in a 130&nbsp;px box with <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">overflow: hidden<\u002Fcode>.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 340px; padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 12px\">Corrected · 250×144 · verb label, no topic<\u002Fdiv>\n        <div style=\"width: 250px; height: 144px; padding: 16px; background: #f8f4eb; border: 1px solid rgba(49,73,63,0.18); border-radius: 18px; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between\"><span style=\"font-size: 19px; font-weight: 700\">Gripper<\u002Fspan><span style=\"font-size: 14px; color: #536960\">commanded: open<\u002Fspan><\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ gripClick }}\" style=\"flex: 1; min-height: 56px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; color: #253d35; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer\">{{ gripLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin: 14px 0 0; font-size: 15px; line-height: 1.55; color: #536960\">The label became a verb — what pressing will do — and the commanded state moved to the header, where it is a fact rather than a promise. Tap it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"defaults\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">08<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Defaults — what a widget looks like before anyone configures it<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"overflow-x: auto; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; padding: 8px\">\n      <sc-raw-table style=\"width: 100%; min-width: 720px; border-collapse: collapse; font-size: 15px\">\n        <sc-raw-thead>\n          <sc-raw-tr style=\"text-align: left\">\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">setting<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">operator app<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">debug / lab app<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding: 14px 16px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #536960; border-bottom: 2px solid rgba(49,73,63,0.18)\">rule<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">show_details<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">false<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; font-weight: 700; border-bottom: 1px solid rgba(49,73,63,0.1)\">true<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">Topics and axis maps are diagnostics. Today Drive ships them on, on every widget.<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">labels.*<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; border-bottom: 1px solid rgba(49,73,63,0.1)\">operator words<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; border-bottom: 1px solid rgba(49,73,63,0.1)\">operator words<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">Forward / Back / Left / Right. <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">X+<\u002Fcode> and <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px\">linear_x<\u002Fcode> never reach an operator surface.<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">toggle labels<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; border-bottom: 1px solid rgba(49,73,63,0.1)\">verbs<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; border-bottom: 1px solid rgba(49,73,63,0.1)\">verbs<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">\"Close gripper\", not \"Closed\". A button says what it does; a header says what is true.<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">axis_deadzone<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">0.2<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">0.2<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">Matches the physical joystick (ADR 0120). The profile's dead zone overrides it — it belongs to the person.<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">publish_rate_hz<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">30<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">30<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">Zeros at rest too; the manager declares the tablet dead after 0.2 s.<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background: #f8f4eb\">\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">returnToCenter<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">true<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid rgba(49,73,63,0.1)\">true<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960; border-bottom: 1px solid rgba(49,73,63,0.1)\">On motion axes always. A speed <em>limit<\u002Fem> is not a motion axis and must not return.<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding: 14px 16px; font-family: 'JetBrains Mono', monospace\">mode feedback<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px\">requested<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px\">requested<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding: 14px 16px; color: #536960\">The manager never publishes its mode (ADR 0115). No surface may word it as confirmed.<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"states\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">09<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">States — every control, six ways<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 12px\">\n      <div style=\"padding: 16px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"min-height: 56px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700\">Jaco<\u002Fdiv>\n        <div><div style=\"font-size: 15px; font-weight: 700\">idle<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45; color: #536960\">cream fill, hairline border<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"min-height: 56px; border: 2px solid #31493f; border-radius: 14px; background: #31493f; color: #fffaf1; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700\">Jaco<\u002Fdiv>\n        <div><div style=\"font-size: 15px; font-weight: 700\">selected<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45; color: #536960\">forest fill — last <em>requested<\u002Fem><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"min-height: 56px; border: 2px solid #31493f; border-radius: 14px; background: #ffd89b; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700\">SNAKE ON<\u002Fdiv>\n        <div><div style=\"font-size: 15px; font-weight: 700\">held<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45; color: #536960\">pollen — ends on release<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"min-height: 56px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; opacity: 0.4\">Tool<\u002Fdiv>\n        <div><div style=\"font-size: 15px; font-weight: 700\">interlocked<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45; color: #536960\">40% — legal, not now<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"min-height: 56px; border: 2px dashed rgba(49,73,63,0.35); border-radius: 14px; background: #f8f4eb; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px\"><span style=\"font-size: 15px; font-weight: 700; color: #536960\">Tool<\u002Fspan><span style=\"font-size: 12px; color: #536960\">not on this robot<\u002Fspan><\u002Fdiv>\n        <div><div style=\"font-size: 15px; font-weight: 700\">unsupported<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45; color: #536960\">dashed + backend reason<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 16px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"min-height: 56px; border: 2px solid #9b3d2e; border-radius: 14px; background: #f5ddd8; color: #4f1f16; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700\">Release<\u002Fdiv>\n        <div><div style=\"font-size: 15px; font-weight: 700\">destructive<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.45; color: #536960\">error container + verb<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 18px 0 0; font-size: 16px; line-height: 1.6; max-width: 70ch; color: #536960; text-wrap: pretty\">Interlocked and unsupported are different facts and must not share a treatment: <em>interlocked<\u002Fem> means release the pads and you may; <em>unsupported<\u002Fem> means this robot will never offer it. Opacity alone carries neither — both pair with a word.<\u002Fp>\n\n    <div style=\"margin-top: 16px; padding: 22px; background: #f5ddd8; border: 1px solid rgba(155,61,46,0.3); border-radius: 18px\">\n      <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #4f1f16; font-weight: 700; margin-bottom: 10px\">Never dim a container<\u002Fdiv>\n      <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.6; color: #4f1f16; max-width: 76ch; text-wrap: pretty\"><code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">opacity<\u002Fcode> on a card multiplies the contrast of <em>everything<\u002Fem> inside it, including text that passes on its own. A 5.37:1 badge inside a card at <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">opacity: 0.62<\u002Fcode> measures 2.45:1 — and nothing in the markup says so, which is why it survives review.<\u002Fp>\n      <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4f1f16; max-width: 76ch; text-wrap: pretty\">Dim the <strong>one element<\u002Fstrong> whose state it is, and only where the result still measures. For an unsupported or unavailable thing, use the treatment above instead: <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">#f8f4eb<\u002Fcode> fill, <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">2px dashed rgba(49,73,63,0.35)<\u002Fcode>, label at <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">#536960<\u002Fcode> — 5.37:1, and it reads as unavailable rather than as faded.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"chrome\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">10<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Runtime chrome — the bar and the STOP<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background: #2a2f2c; border-radius: 20px; padding: 14px; margin-bottom: 16px; overflow-x: auto\">\n      <div style=\"min-width: 900px; border-radius: 8px; overflow: hidden\">\n        <div style=\"height: 44px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #f8f4eb; border-bottom: 1px solid rgba(49,73,63,0.18); font-family: 'Atkinson Hyperlegible', sans-serif\">\n          <span style=\"font-size: 18px; font-weight: 700; letter-spacing: -0.01em\">Explorer Manager<\u002Fspan>\n          <span style=\"font-size: 16px; color: #5c6b63\">Drive<\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 9px; background: #c8d5c4\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #253d35\"><\u002Fspan><span style=\"font-size: 15px; font-weight: 700; letter-spacing: 0.04em\">READY<\u002Fspan><\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; padding: 4px 10px; border: 1px solid rgba(49,73,63,0.18); border-radius: 8px\">base_link<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #5c6b63\">30 Hz<\u002Fspan>\n          <span style=\"flex: 1\"><\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #5c6b63\">Operator<\u002Fspan>\n          <span style=\"min-width: 56px; height: 34px; border: 1px solid rgba(49,73,63,0.18); border-radius: 10px; background: #fffaf1; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700\">⋯<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px\">\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 10px\">The bar holds six things<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">App name, screen name, truthful link status, command frame, publish rate, profile, maintenance hold. Nothing else earns 44&nbsp;px across the top of an operator's panel. The status chip describes the <em>frontend-to-backend link<\u002Fem> and says so; it never implies the arm is reachable.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #9b3d2e; font-weight: 700; margin-bottom: 10px\">Gap in the build<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Today the bar shows app, status, robot, frame and a hamburger. It is missing the <strong>screen name<\u002Fstrong> and the <strong>publish rate<\u002Fstrong> — the two things that tell an operator which screen they are on and that the tablet is still alive. The hamburger also reads as a menu; maintenance is a 1.5&nbsp;s hold and should look like one, with the hold drawn as a fill.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch\">\n      <div style=\"flex: 1 1 260px; padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #9b3d2e; font-weight: 700\">In the build today<\u002Fdiv>\n        <div style=\"height: 120px; border-radius: 18px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); box-shadow: 0 8px 20px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #9b3d2e; letter-spacing: 0.04em\">STOP<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #536960\">A white card with red text, the same weight as every widget around it. At a glance it is a label, not a control.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 260px; padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700\">Specified · press to latch<\u002Fdiv>\n        <button type=\"button\" sc-camel-on-pointer-down=\"{{ stopDown }}\" sc-camel-on-pointer-up=\"{{ stopUp }}\" sc-camel-on-pointer-leave=\"{{ stopUp }}\" sc-camel-on-pointer-cancel=\"{{ stopUp }}\" style=\"position: relative; height: 120px; border: none; border-radius: 18px; background: {{ stopBg }}; color: #fffaf1; font-family: inherit; font-size: 22px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; overflow: hidden\">\n          <span style=\"position: relative; z-index: 2\">{{ stopLabel }}<\u002Fspan>\n          <span ref=\"{{ fillRef }}\" style=\"position: absolute; left: 0; bottom: 0; height: 6px; width: 0%; background: #c8d5c4\"><\u002Fspan>\n        <\u002Fbutton>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #536960\">Filled error, full-bleed in the status rail, the largest target on the screen. Press stops instantly; resuming is a one-second hold drawn as a fill. Try it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 260px; padding: 22px; background: #31493f; color: #fffaf1; border-radius: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #c8d5c4; font-weight: 700\">Rules<\u002Fdiv>\n        <ul style=\"margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; gap: 8px\">\n          <li>STOP is chrome, never a widget. It cannot be moved, resized or removed by an app author.<\u002Fli>\n          <li>Same corner on every screen of every app. Eyes-off means muscle memory.<\u002Fli>\n          <li>Stopped: pads dim to 45% and go inert; mode and frame buttons stay live so the operator can prepare the resume.<\u002Fli>\n          <li>Minimum 176×120 at scale 1.0, and it is exempt from fit-scaling below 64&nbsp;px of glass.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"locale\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">11<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Locale — layout must survive +40%<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 22px; font-size: 18px; line-height: 1.6; max-width: 70ch; text-wrap: pretty\">Spanish and French safety wording runs 25–40% longer than English. A control sized to its English label is a control that clips in French. Every label below is set at the same card size; the design must hold at the longest of the three.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px\">\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #536960\">EN<\u002Fdiv>\n        <div style=\"min-height: 56px; padding: 0 16px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-align: center\">Hold to resume<\u002Fdiv>\n        <div style=\"min-height: 56px; padding: 0 16px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-align: center\">Close gripper<\u002Fdiv>\n        <div style=\"min-height: 56px; padding: 0 16px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-align: center\">Hold for maintenance<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #536960\">ES · +28%<\u002Fdiv>\n        <div style=\"min-height: 56px; padding: 0 16px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.2\">Mantener para reanudar<\u002Fdiv>\n        <div style=\"min-height: 56px; padding: 0 16px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.2\">Cerrar la pinza<\u002Fdiv>\n        <div style=\"min-height: 56px; padding: 0 16px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.2\">Mantener para mantenimiento<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px; display: flex; flex-direction: column; gap: 12px\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #536960\">FR · +36%<\u002Fdiv>\n        <div style=\"min-height: 56px; padding: 0 16px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.2\">Maintenir pour reprendre<\u002Fdiv>\n        <div style=\"min-height: 56px; padding: 0 16px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.2\">Fermer la pince<\u002Fdiv>\n        <div style=\"min-height: 56px; padding: 0 16px; border: 2px solid rgba(49,73,63,0.18); border-radius: 14px; background: #f2eadc; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; text-align: center; line-height: 1.2\">Maintenir pour la maintenance<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top: 14px; padding: 20px; background: #e7ede2; border: 1px solid rgba(49,73,63,0.2); border-radius: 18px\">\n      <p style=\"margin: 0; font-size: 16px; line-height: 1.6; max-width: 76ch; text-wrap: pretty\"><strong>Rule:<\u002Fstrong> control labels wrap to two lines and the control grows; they never shrink their type and never truncate. Authored labels — app, screen and widget titles — stay as written, because they are configuration data. Topics, frame ids, axes and numbers are never translated.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"builder\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">12<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Builder — a different density, the same product<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 22px; font-size: 18px; line-height: 1.6; max-width: 70ch; text-wrap: pretty\">The builder is desktop, mouse-first, and dense. It is allowed 40&nbsp;px targets, multi-column forms and hover affordances — but it uses the same tokens, the same type and the same card language, so an author never has to translate between the thing they are editing and the thing an operator will hold.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px\">\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 10px\">Canvas<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">The canvas is the operator's panel at true scale, on a <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">#2a2f2c<\u002Fcode> desk, with the device frame drawn around it. Three frames — 1024×600, 1280×720, 1820×720 — switch without leaving the screen. Panels never take space from it once editing starts.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 10px\">Selection &amp; overlap<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Selected widget: 2&nbsp;px forest outline plus a live size chip reading <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">400×440 · 56px glass<\u002Fcode>. Overlapping interactive widgets get a petal wash and a named pair, immediately — not at publish time.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 10px\">Undersize warning<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Below the §07 minimum, the widget gets a pollen corner tag and the inspector offers <em>Resize to 250×144<\u002Fem> as one action. Authoring is never blocked; publishing surfaces it in the review checklist.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 10px\">Libraries<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">App and screen cards use colour for grouping only — screen type, never status. Previews are on demand. Human names come before ids; an id is mono, small, and second.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 10px\">Forms<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Label above field, 40&nbsp;px rows, 8&nbsp;px radius, one column per concept. Destructive actions confirm inline with cancel/confirm — never <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">window.confirm<\u002Fcode>.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #31493f; font-weight: 700; margin-bottom: 10px\">Review checklist<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Geometry, touch bounds, overlap, command frame, topic policy — plus, now, minimum size and sibling symmetry. Each check names the widget and offers the fix. Export stays the last gate.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"landing\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">13<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Landing — the only place Bloom raises its voice<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch\">\n      <div style=\"flex: 2 1 420px; padding: 32px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 22px\">\n        <p style=\"margin: 0 0 12px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Specimen<\u002Fp>\n        <h2 style=\"margin: 0 0 16px; font-family: 'Cormorant Garamond', serif; font-size: 46px; font-weight: 500; line-height: 1.05; max-width: 16ch\">Build and operate accessible interfaces for robots.<\u002Fh2>\n        <p style=\"margin: 0 0 22px; font-size: 17px; line-height: 1.6; max-width: 54ch; color: #536960; text-wrap: pretty\">Display serif at 46&nbsp;px and above, one paragraph of Atkinson beneath it, two pill actions. Landing is the one surface allowed a mood image and a hero measure; it is not allowed a gradient, a product screenshot in a fake browser, or a stat row.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n          <span style=\"min-height: 48px; padding: 12px 24px; border-radius: 999px; background: #31493f; color: #fffaf1; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center\">Open Builder<\u002Fspan>\n          <span style=\"min-height: 48px; padding: 12px 24px; border-radius: 999px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.24); font-size: 16px; font-weight: 700; display: inline-flex; align-items: center\">Open Runtime<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 260px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"flex: 1; min-height: 190px; border-radius: 22px; border: 1px solid rgba(49,73,63,0.14); background: repeating-linear-gradient(135deg, #f8f4eb 0 10px, #f2eadc 10px 20px); display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; color: #536960\">mood image — the arm in use,<br>in a real room, with a person<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #31493f; color: #fffaf1; border-radius: 18px\">\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.55\">Tone: Bloom restores a person's gesture. Never \"control your robot\". Never a dark dashboard, a terminal, or a game-like pictogram.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"invariants\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 0\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">14<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Cross-surface invariants — what must never diverge<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding: 30px; background: #31493f; color: #fffaf1; border-radius: 22px\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px\">\n        <div>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: #c8d5c4; margin-bottom: 8px\">01<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">A widget renders identically in builder and runtime. Runtime only removes editor affordances — it never resizes, reflows or restyles a widget.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: #c8d5c4; margin-bottom: 8px\">02<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Tokens come from <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">libs/ui<\u002Fcode>. No feature file names a colour. The three violations in §02 are the standing exceptions and are to be removed.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: #c8d5c4; margin-bottom: 8px\">03<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Colour never carries meaning alone. Every state in §09 pairs with a word, a border treatment, or both.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: #c8d5c4; margin-bottom: 8px\">04<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">No surface claims more than it knows. \"Requested\", not \"active\"; link status, not robot status; simulated says simulated.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: #c8d5c4; margin-bottom: 8px\">05<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Adapter language stays out of operator surfaces. Frames and topics live in the bar, in maintenance and in debug.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: #c8d5c4; margin-bottom: 8px\">06<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">A control is in the same place on every screen of an app. Moving STOP, the maintenance hold, or the status chip between screens is a defect.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"trace\" style=\"max-width: 1160px; margin: 0 auto; padding: 56px 32px 100px\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #9b3d2e\">15<\u002Fspan>\n      <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #536960\">Traceability — where design work lives<\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: rgba(49,73,63,0.16)\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch\">\n      <div style=\"flex: 1 1 380px; padding: 24px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n        <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #536960; font-weight: 700; margin-bottom: 14px\">Same repo · design ships with the code<\u002Fdiv>\n        <pre style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; color: #253d35\">docs/design/\n  README.md              entry point, how to use this\n  design-system.html     this page, the living reference\n  widget-min-size.md     §07 as a table + the constant\n  screens/\n    drive.md             spec + rationale + captures\n    joystick-lab.md\n  reviews/\n    2026-09-17-drive.md  finding → decision → screen → commit\n  captures/\n    drive-1280x720.png<\u002Fpre>\n      <\u002Fdiv>\n      <div style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n          <div style=\"font-size: 17px; font-weight: 700; margin-bottom: 8px\">ADR — when a rule constrains code<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Minimum sizes, the 44&nbsp;px bar, the region model, axis colour tokens. Same <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px\">docs/decisions<\u002Fcode> folder as architecture — ADR 0115, 0120 and 0127 already work this way.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 22px; background: #fffaf1; border: 1px solid rgba(49,73,63,0.14); border-radius: 18px\">\n          <div style=\"font-size: 17px; font-weight: 700; margin-bottom: 8px\">Review log — when it is judgement<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Why Pivot became 440 and not 360, why speed limits left the stage. Dated, one file per review, in the same shape as the UX handoff trace so the two read together.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 22px; background: #e7ede2; border: 1px solid rgba(49,73,63,0.2); border-radius: 18px\">\n          <div style=\"font-size: 17px; font-weight: 700; margin-bottom: 8px\">The standard, briefly<\u002Fdiv>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Design lives where the thing it describes lives, and changes in the same pull request. A separate design repo guarantees drift; a design tool as source of truth guarantees two truths. Bloom's tokens are already code — keep the source of truth there and let this page render from them.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { gripClosed: false, stopped: false };\n  timers = {};\n  fillRef = React.createRef();\n  componentDidMount() { document.title = \"Bloom — design implementation reference\"; }\n  componentWillUnmount() { for (const k of Object.keys(this.timers)) clearInterval(this.timers[k]); }\n  setFill(p) { const n = this.fillRef.current; if (n) n.style.width = `${Math.round(p * 100)}%`; }\n  startHold(key, ms, onDone) {\n    this.cancelHold(key);\n    const t0 = Date.now();\n    this.timers[key] = setInterval(() => {\n      const p = Math.min(1, (Date.now() - t0) / ms);\n      this.setFill(p);\n      if (p >= 1) { this.cancelHold(key); onDone(); }\n    }, 40);\n  }\n  cancelHold(key) {\n    if (this.timers[key]) { clearInterval(this.timers[key]); delete this.timers[key]; }\n    this.setFill(0);\n  }\n  renderVals() {\n    const s = this.state;\n    return {\n      gripLabel: s.gripClosed ? \"Open gripper\" : \"Close gripper\",\n      gripClick: () => this.setState({ gripClosed: !s.gripClosed }),\n      stopLabel: s.stopped ? \"HOLD TO RESUME\" : \"STOP\",\n      stopBg: s.stopped ? \"#253d35\" : \"#9b3d2e\",\n      stopDown: () => {\n        if (!s.stopped) { this.setState({ stopped: true }); return; }\n        this.startHold(\"resumeHold\", 1000, () => this.setState({ stopped: false }));\n      },\n      stopUp: () => this.cancelHold(\"resumeHold\"),\n      fillRef: this.fillRef\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
